<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
    <defs>
        <linearGradient id="cardBorder" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#60a5fa" stop-opacity="0.8"/>
            <stop offset="50%" stop-color="#3b82f6" stop-opacity="0.6"/>
            <stop offset="100%" stop-color="#1d4ed8" stop-opacity="0.3"/>
        </linearGradient>
        <linearGradient id="waveGradient" x1="0%" y1="100%" x2="0%" y2="0%">
            <stop offset="0%" stop-color="#1d4ed8"/>
            <stop offset="40%" stop-color="#3b82f6"/>
            <stop offset="80%" stop-color="#38bdf8"/>
            <stop offset="100%" stop-color="#a5f3fc"/>
        </linearGradient>
        <filter id="waveGlow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="1.5" result="blur"/>
            <feMerge>
                <feMergeNode in="blur"/>
                <feMergeNode in="SourceGraphic"/>
            </feMerge>
        </filter>
        <linearGradient id="laserBeam" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#38bdf8" stop-opacity="0"/>
            <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.7"/>
            <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
        </linearGradient>
    </defs>
    <!-- Background rounded card -->
    <rect x="2" y="2" width="60" height="60" rx="14" fill="#09090b" stroke="url(#cardBorder)" stroke-width="1.75"/>
    
    <!-- Subtle sound extraction scan line -->
    <line x1="8" y1="32" x2="56" y2="32" stroke="url(#laserBeam)" stroke-width="1.5" stroke-dasharray="2 2"/>

    <!-- Waveform Bars -->
    <g filter="url(#waveGlow)">
        <!-- Bar 1 (leftmost) -->
        <rect x="9" y="27" width="4" height="10" rx="2" fill="url(#waveGradient)"/>
        <!-- Bar 2 -->
        <rect x="16" y="22" width="4" height="20" rx="2" fill="url(#waveGradient)"/>
        <!-- Bar 3 -->
        <rect x="23" y="16" width="4" height="32" rx="2" fill="url(#waveGradient)"/>
        <!-- Bar 4 (center) -->
        <rect x="30" y="11" width="4" height="42" rx="2" fill="url(#waveGradient)"/>
        <!-- Bar 5 -->
        <rect x="37" y="16" width="4" height="32" rx="2" fill="url(#waveGradient)"/>
        <!-- Bar 6 -->
        <rect x="44" y="22" width="4" height="20" rx="2" fill="url(#waveGradient)"/>
        <!-- Bar 7 (rightmost) -->
        <rect x="51" y="27" width="4" height="10" rx="2" fill="url(#waveGradient)"/>
    </g>

    <!-- Center pulse dots for tech flair -->
    <circle cx="32" cy="7" r="1.5" fill="#67e8f9" opacity="0.8"/>
    <circle cx="32" cy="57" r="1.5" fill="#67e8f9" opacity="0.8"/>
</svg>
