<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MEDIA PRO — MediaSoundExtractor</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <meta name="description" content="MEDIA PRO (MediaSoundExtractor) - 100% Client-side in-browser audio extractor powered by FFmpeg.wasm.">
    <meta name="robots" content="index, follow">
    <meta name="theme-color" content="#09090b">
    <link rel="canonical" href="https://mediasoundextractor.netlify.app/">
    <link rel="alternate" hreflang="zh-TW" href="https://mediasoundextractor.netlify.app/zh/">
    <link rel="alternate" hreflang="en" href="https://mediasoundextractor.netlify.app/en/">
    <link rel="alternate" hreflang="x-default" href="https://mediasoundextractor.netlify.app/">
    <script>
        (function () {
            try {
                var pref = localStorage.getItem('mse_lang_pref');
                if (pref === 'zh') {
                    location.replace('./zh/');
                    return;
                }
                if (pref === 'en') {
                    location.replace('./en/');
                    return;
                }
            } catch (e) {
                // Storage access might be restricted in private browsing
            }

            var langs = (navigator.languages && navigator.languages.length) ? navigator.languages : [navigator.language || ''];
            var leading = (langs[0] || '').toLowerCase();
            if (leading.startsWith('zh')) {
                location.replace('./zh/');
                return;
            }
            location.replace('./en/');
        })();
    </script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #09090b;
            color: #f4f4f5;
            font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 1.5rem;
        }

        .container {
            text-align: center;
            max-width: 480px;
            background: #18181b;
            border: 1px solid #27272a;
            border-radius: 1.5rem;
            padding: 2.5rem 2rem;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        h1 {
            font-size: 2rem;
            font-weight: 900;
            margin-bottom: 0.5rem;
            letter-spacing: -0.05em;
            font-style: italic;
        }

        h1 span {
            color: #3b82f6;
        }

        .subtitle {
            color: #71717a;
            font-size: 0.75rem;
            font-weight: 700;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            margin-bottom: 1.5rem;
        }

        p {
            color: #a1a1aa;
            font-size: 0.875rem;
            line-height: 1.5;
            margin-bottom: 1.75rem;
        }

        .links {
            display: flex;
            gap: 1rem;
            justify-content: center;
        }

        a {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 0.75rem 1.5rem;
            background-color: #27272a;
            color: #fafafa;
            border: 1px solid #3f3f46;
            border-radius: 0.75rem;
            text-decoration: none;
            font-size: 0.875rem;
            font-weight: 700;
            transition: all 0.2s ease;
        }

        a:hover {
            background-color: #3b82f6;
            border-color: #3b82f6;
            color: #ffffff;
            transform: translateY(-1px);
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>MEDIA <span>PRO</span></h1>
        <div class="subtitle">MediaSoundExtractor</div>
        <p>100% In-Browser Audio Extractor (FFmpeg.wasm)<br>Please select your language / 請選擇語言：</p>
        <div class="links">
            <a href="./zh/">繁體中文</a>
            <a href="./en/">English</a>
        </div>
    </div>
</body>

</html>
