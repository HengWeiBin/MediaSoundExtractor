<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MEDIA PRO - FFmpeg Core</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background-color: #09090b;
        }

        .drop-zone--over {
            border-color: #3b82f6;
            background-color: rgba(30, 58, 138, 0.2);
        }

        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
        }

        .custom-scrollbar::-webkit-scrollbar-track {
            background: #18181b;
        }

        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #3f3f46;
            border-radius: 10px;
        }

        @keyframes scan {
            0% {
                transform: translateY(-100%);
            }

            100% {
                transform: translateY(100%);
            }
        }

        .scanning::after {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(to bottom, transparent, rgba(59, 130, 246, 0.1), transparent);
            animation: scan 2s linear infinite;
            pointer-events: none;
        }

        /* Loading Overlay */
        #coreLoader {
            backdrop-filter: blur(10px);
        }
    </style>
</head>

<body class="min-h-screen text-zinc-100 p-4 md:p-8 font-sans relative">

    <div id="coreLoader"
        class="fixed inset-0 z-50 flex flex-col items-center justify-center bg-zinc-950/90 backdrop-blur-md p-6 text-center transition-opacity duration-500">
        <div id="loaderSpinner" class="relative w-16 h-16 mb-4">
            <div class="absolute inset-0 border-4 border-zinc-800 rounded-full"></div>
            <div class="absolute inset-0 border-4 border-blue-500 border-t-transparent rounded-full animate-spin"></div>
        </div>
        <h2 id="loaderTitle" class="text-xl font-bold text-white mb-2 tracking-widest">SYSTEM INITIALIZING</h2>
        <p class="text-zinc-400 text-xs font-mono max-w-md mb-4" id="loaderText">Loading FFmpeg Core...</p>
        <div id="loaderActions" class="hidden flex flex-col items-center gap-3 max-w-md">
            <div id="loaderErrorDetail" class="text-left bg-zinc-900 border border-red-500/30 rounded-xl p-4 text-xs text-zinc-300 font-mono leading-relaxed overflow-auto max-h-40 w-full"></div>
            <button id="retryBtn" class="px-5 py-2.5 bg-blue-600 hover:bg-blue-500 text-white text-xs font-bold rounded-xl transition-all shadow-lg shadow-blue-500/20 active:scale-95">
                重試載入 (Retry)
            </button>
        </div>
    </div>

    <div class="max-w-4xl mx-auto blur-sm transition-all duration-500" id="mainApp">
        <header class="flex flex-col md:flex-row md:items-end justify-between mb-8 gap-4">
            <div>
                <h1 class="text-4xl font-black tracking-tighter text-white mb-2 italic">MEDIA <span
                        class="text-blue-500">PRO</span></h1>
                <p class="text-zinc-500 text-sm font-medium uppercase tracking-widest">FFMPEG POWERED CONVERTER</p>
            </div>

            <div class="flex flex-wrap gap-3">
                <div class="flex items-center bg-zinc-900 border border-zinc-800 rounded-xl px-4 py-2">
                    <span class="text-xs font-bold mr-3 text-zinc-400 uppercase">輸出 MP3 (128k)</span>
                    <button id="compressToggle"
                        class="relative inline-flex h-6 w-11 items-center rounded-full bg-zinc-700 transition-colors focus:outline-none">
                        <span id="toggleKnob"
                            class="inline-block h-4 w-4 transform rounded-full bg-white transition-transform translate-x-1"></span>
                    </button>
                    <span class="text-xs font-bold ml-3 text-zinc-500 uppercase">否則 WAV</span>
                </div>
                <button id="downloadAllBtn"
                    class="hidden px-4 py-2 bg-blue-600 hover:bg-blue-500 text-white text-xs font-bold rounded-xl transition-all disabled:opacity-50">
                    一鍵下載全部
                </button>
                <button id="clearAllBtn"
                    class="hidden px-4 py-2 bg-zinc-800 hover:bg-zinc-700 text-zinc-300 text-xs font-bold rounded-xl border border-zinc-700">
                    清空列表
                </button>
            </div>
        </header>

        <main class="grid grid-cols-1 lg:grid-cols-12 gap-8">
            <div class="lg:col-span-5">
                <div id="dropZone"
                    class="relative h-64 lg:h-[450px] border-2 border-dashed border-zinc-800 rounded-3xl flex flex-col items-center justify-center transition-all duration-300 hover:border-blue-500 group cursor-pointer overflow-hidden bg-zinc-900/20">
                    <input type="file" id="fileInput" class="hidden" accept="video/*,audio/*" multiple>
                    <div class="z-10 text-center p-6">
                        <div
                            class="mb-6 mx-auto w-20 h-20 rounded-2xl bg-zinc-900 border border-zinc-800 flex items-center justify-center group-hover:scale-110 group-hover:border-blue-500 transition-all duration-500">
                            <svg xmlns="http://www.w3.org/2000/svg"
                                class="h-10 w-10 text-zinc-500 group-hover:text-blue-500" fill="none"
                                viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
                                    d="M12 4v16m8-8H4" />
                            </svg>
                        </div>
                        <h3 class="text-xl font-bold text-white mb-2">拖放媒體檔案</h3>
                        <p class="text-zinc-500 text-sm max-w-[200px] mx-auto">支援各類影音格式<br>由 FFmpeg 核心驅動</p>
                    </div>
                </div>
            </div>

            <div class="lg:col-span-7">
                <div
                    class="bg-zinc-900/50 border border-zinc-800 rounded-3xl h-[450px] flex flex-col overflow-hidden shadow-2xl">
                    <div class="p-5 border-b border-zinc-800 bg-zinc-900/80 flex justify-between items-center">
                        <h2 class="text-sm font-bold uppercase tracking-widest text-zinc-400">處理隊列 (<span
                                id="taskCount">0</span>)</h2>
                        <div id="globalSpinner" class="hidden">
                            <svg class="animate-spin h-4 w-4 text-blue-500" viewBox="0 0 24 24">
                                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor"
                                    stroke-width="4"></circle>
                                <path class="opacity-75" fill="currentColor"
                                    d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path>
                            </svg>
                        </div>
                    </div>

                    <div id="taskList" class="flex-1 overflow-y-auto p-4 space-y-3 custom-scrollbar">
                        <div id="emptyState" class="h-full flex flex-col items-center justify-center text-zinc-600">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-12 w-12 mb-3 opacity-20" fill="none"
                                viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1"
                                    d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 01-3-3V5a3 3 0 116 0v6a3 3 0 01-3 3z" />
                            </svg>
                            <p class="text-xs uppercase font-bold tracking-widest">尚未添加任務</p>
                        </div>
                    </div>

                    <div class="p-2 bg-black border-t border-zinc-800 text-[10px] font-mono text-zinc-500 h-8 overflow-hidden whitespace-nowrap"
                        id="statusLog">
                        System Initializing...
                    </div>
                </div>
            </div>
        </main>

        <footer
            class="mt-12 pt-8 border-t border-zinc-900 flex flex-col md:flex-row justify-between items-center gap-4">
            <div class="flex items-center gap-6">
                <div class="flex flex-col">
                    <span class="text-[10px] text-zinc-600 font-bold uppercase tracking-tighter">Core Engine</span>
                    <span class="text-xs text-zinc-400">FFmpeg.wasm v0.12 (Blob Mode)</span>
                </div>
                <div class="flex flex-col border-l border-zinc-800 pl-6">
                    <span class="text-[10px] text-zinc-600 font-bold uppercase tracking-tighter">Performance</span>
                    <span class="text-xs text-zinc-400">Browser WASM / No Server Upload</span>
                </div>
            </div>
            <p class="text-zinc-700 text-[10px] font-medium italic">PROCESSING LOCALLY</p>
        </footer>
    </div>

    <script type="module">
        // 引入 FFmpeg 與 toBlobURL 工具 (解決 Worker Origin 錯誤的關鍵)
        import { FFmpeg } from 'https://unpkg.com/@ffmpeg/ffmpeg@0.12.10/dist/esm/index.js';
        import { fetchFile, toBlobURL } from 'https://unpkg.com/@ffmpeg/util@0.12.1/dist/esm/index.js';

        // --- 全域變數 ---
        let ffmpeg = null;
        let isCompressMode = false;
        let tasks = [];
        let isProcessing = false;

        // --- DOM Elements ---
        const dropZone = document.getElementById('dropZone');
        const fileInput = document.getElementById('fileInput');
        const taskList = document.getElementById('taskList');
        const emptyState = document.getElementById('emptyState');
        const taskCountDisplay = document.getElementById('taskCount');
        const compressToggle = document.getElementById('compressToggle');
        const toggleKnob = document.getElementById('toggleKnob');
        const downloadAllBtn = document.getElementById('downloadAllBtn');
        const clearAllBtn = document.getElementById('clearAllBtn');
        const globalSpinner = document.getElementById('globalSpinner');
        const coreLoader = document.getElementById('coreLoader');
        const mainApp = document.getElementById('mainApp');
        const loaderText = document.getElementById('loaderText');
        const statusLog = document.getElementById('statusLog');

        const loaderSpinner = document.getElementById('loaderSpinner');
        const loaderTitle = document.getElementById('loaderTitle');
        const loaderActions = document.getElementById('loaderActions');
        const loaderErrorDetail = document.getElementById('loaderErrorDetail');
        const retryBtn = document.getElementById('retryBtn');

        // 檢查是否為 file:// 協定
        function checkFileProtocol() {
            if (window.location.protocol === 'file:') {
                loaderSpinner.classList.add('hidden');
                loaderTitle.textContent = "⚠️ 需要本機伺服器環境";
                loaderTitle.classList.add('text-amber-400');
                loaderText.textContent = "瀏覽器安全性限制：WebAssembly 與 Web Worker 無法在 file:// 協定直接執行。";
                loaderErrorDetail.innerHTML = `
                    <p class="font-bold text-white mb-2">請使用以下任一方式啟動本機伺服器：</p>
                    <div class="mb-2">
                        <span class="text-blue-400 font-bold">方法 1 (VS Code)：</span><br>
                        安裝「Live Server」擴充套件，右鍵點擊 index.html 選擇 <span class="text-zinc-100">"Open with Live Server"</span>
                    </div>
                    <div class="mb-2">
                        <span class="text-blue-400 font-bold">方法 2 (Python)：</span><br>
                        在終端機執行：<code class="bg-zinc-800 px-1 py-0.5 rounded text-green-400">python -m http.server 8000</code><br>
                        接著瀏覽器打開 <a href="http://localhost:8000" class="text-blue-400 underline" target="_blank">http://localhost:8000</a>
                    </div>
                    <div>
                        <span class="text-blue-400 font-bold">方法 3 (Node.js)：</span><br>
                        在終端機執行：<code class="bg-zinc-800 px-1 py-0.5 rounded text-green-400">npx serve .</code>
                    </div>
                `;
                loaderActions.classList.remove('hidden');
                retryBtn.textContent = "檢查環境並重試";
                return true;
            }
            return false;
        }

        // --- FFmpeg 初始化 (含多 CDN 容錯與超時保護) ---
        const CDN_PROVIDERS = [
            {
                name: 'unpkg',
                coreBase: 'https://unpkg.com/@ffmpeg/core@0.12.6/dist/esm',
                ffmpegBase: 'https://unpkg.com/@ffmpeg/ffmpeg@0.12.10/dist/esm'
            },
            {
                name: 'jsdelivr',
                coreBase: 'https://cdn.jsdelivr.net/npm/@ffmpeg/core@0.12.6/dist/esm',
                ffmpegBase: 'https://cdn.jsdelivr.net/npm/@ffmpeg/ffmpeg@0.12.10/dist/esm'
            }
        ];

        async function initFFmpegWithProvider(provider) {
            ffmpeg = new FFmpeg();

            // 綁定 Log 事件
            ffmpeg.on('log', ({ message }) => {
                statusLog.textContent = `[FFmpeg] ${message}`;
            });

            // 綁定 Progress 事件 (0-1)
            ffmpeg.on('progress', ({ progress, time }) => {
                if (currentProcessingTaskId) {
                    const percent = Math.round(progress * 100);
                    updateTaskProgressUI(currentProcessingTaskId, percent);
                }
            });

            // 1. 下載 Worker 並修正相對路徑
            loaderText.textContent = `下載 Worker 模組 (${provider.name})...`;
            const workerReq = await fetch(`${provider.ffmpegBase}/worker.js`);
            if (!workerReq.ok) throw new Error(`無法下載 Worker 腳本 (${workerReq.status})`);
            let workerScript = await workerReq.text();
            workerScript = workerScript.replace(/["']\.\/const\.js["']/g, `"${provider.ffmpegBase}/const.js"`);
            workerScript = workerScript.replace(/["']\.\/errors\.js["']/g, `"${provider.ffmpegBase}/errors.js"`);
            const workerBlob = new Blob([workerScript], { type: 'text/javascript' });
            const workerBlobURL = URL.createObjectURL(workerBlob);

            // 2. 下載 Core JS 與 WASM
            loaderText.textContent = `下載 FFmpeg Core JS (${provider.name})...`;
            const coreBlobURL = await toBlobURL(`${provider.coreBase}/ffmpeg-core.js`, 'text/javascript');

            loaderText.textContent = `下載 WASM 核心二進位檔 (${provider.name})...`;
            const wasmBlobURL = await toBlobURL(`${provider.coreBase}/ffmpeg-core.wasm`, 'application/wasm');

            // 3. 載入並編譯 WASM
            loaderText.textContent = "編譯 WebAssembly 模組中...";
            
            // 設置載入超時控制
            const loadPromise = ffmpeg.load({
                coreURL: coreBlobURL,
                wasmURL: wasmBlobURL,
                classWorkerURL: workerBlobURL,
            });

            const timeoutPromise = new Promise((_, reject) => {
                setTimeout(() => reject(new Error("載入超時 (WASM 編譯或 Worker 通訊未能在預期時間內完成)")), 25000);
            });

            await Promise.race([loadPromise, timeoutPromise]);
        }

        async function loadFFmpeg() {
            // 重設 UI
            loaderSpinner.classList.remove('hidden');
            loaderTitle.textContent = "SYSTEM INITIALIZING";
            loaderTitle.className = "text-xl font-bold text-white mb-2 tracking-widest";
            loaderActions.classList.add('hidden');
            loaderText.className = "text-zinc-400 text-xs font-mono max-w-md mb-4";

            if (checkFileProtocol()) {
                return;
            }

            let lastError = null;

            for (const provider of CDN_PROVIDERS) {
                try {
                    console.log(`Attempting FFmpeg load with ${provider.name}...`);
                    await initFFmpegWithProvider(provider);

                    // 載入成功
                    coreLoader.classList.add('opacity-0');
                    mainApp.classList.remove('blur-sm');
                    setTimeout(() => {
                        coreLoader.classList.add('hidden');
                    }, 500);

                    console.log("FFmpeg loaded successfully via " + provider.name);
                    statusLog.textContent = "System Ready.";
                    return;

                } catch (error) {
                    console.warn(`Provider ${provider.name} failed:`, error);
                    lastError = error;
                }
            }

            // 全部 CDN 嘗試皆失敗
            console.error("All providers failed to load FFmpeg:", lastError);
            loaderSpinner.classList.add('hidden');
            loaderTitle.textContent = "INITIALIZATION FAILED";
            loaderTitle.classList.add('text-red-500');
            loaderText.textContent = "FFmpeg 核心模組載入失敗";
            loaderErrorDetail.innerHTML = `
                <p class="font-bold text-red-400 mb-1">錯誤資訊：</p>
                <p class="text-zinc-300 mb-3">${lastError ? (lastError.message || lastError) : '未知錯誤'}</p>
                <p class="font-bold text-white mb-1">可能原因與排查：</p>
                <ul class="list-disc list-inside text-zinc-400 space-y-1">
                    <li>請確認網路連線正常（CDN 存取未被防火牆或廣告攔截器阻擋）。</li>
                    <li>若於本機環境測試，請確認透過本機 HTTP 伺服器（非 file://）執行。</li>
                </ul>
            `;
            loaderActions.classList.remove('hidden');
            retryBtn.textContent = "重試載入 (Retry)";
            statusLog.textContent = "Initialization Failed.";
        }

        retryBtn.addEventListener('click', () => {
            loadFFmpeg();
        });

        // 啟動載入
        loadFFmpeg();

        // --- 事件監聽 ---
        dropZone.addEventListener('click', () => fileInput.click());
        fileInput.addEventListener('change', (e) => addTasks(Array.from(e.target.files)));

        compressToggle.addEventListener('click', () => {
            isCompressMode = !isCompressMode;
            toggleKnob.className = `inline-block h-4 w-4 transform rounded-full bg-white transition-transform ${isCompressMode ? 'translate-x-6' : 'translate-x-1'}`;
            compressToggle.className = `relative inline-flex h-6 w-11 items-center rounded-full transition-colors focus:outline-none ${isCompressMode ? 'bg-blue-600' : 'bg-zinc-700'}`;
        });

        clearAllBtn.addEventListener('click', () => {
            tasks.forEach(t => t.url && URL.revokeObjectURL(t.url));
            tasks = [];
            renderAll();
        });

        downloadAllBtn.addEventListener('click', () => {
            tasks.forEach(t => {
                if (t.status === 'done' && t.url) {
                    const a = document.createElement('a');
                    a.href = t.url;
                    a.download = t.outputName;
                    a.click();
                }
            });
        });

        ['dragover', 'dragleave', 'drop'].forEach(evt => {
            dropZone.addEventListener(evt, (e) => { e.preventDefault(); e.stopPropagation(); });
        });
        dropZone.addEventListener('dragover', () => dropZone.classList.add('drop-zone--over'));
        dropZone.addEventListener('dragleave', () => dropZone.classList.remove('drop-zone--over'));
        dropZone.addEventListener('drop', (e) => {
            dropZone.classList.remove('drop-zone--over');
            addTasks(Array.from(e.dataTransfer.files));
        });

        // --- 核心邏輯 ---

        let currentProcessingTaskId = null;

        function addTasks(files) {
            const newTasks = files.map(file => ({
                id: crypto.randomUUID(),
                file: file,
                name: file.name,
                status: 'pending',
                progress: 0,
                url: null,
                outputName: '',
                size: (file.size / (1024 * 1024)).toFixed(1) + 'MB'
            }));
            tasks = [...tasks, ...newTasks];
            renderAll();
            processNext();
        }

        async function processNext() {
            if (isProcessing || !ffmpeg) return;

            const next = tasks.find(t => t.status === 'pending');
            if (!next) {
                isProcessing = false;
                currentProcessingTaskId = null;
                globalSpinner.classList.add('hidden');
                return;
            }

            isProcessing = true;
            currentProcessingTaskId = next.id;
            globalSpinner.classList.remove('hidden');
            next.status = 'processing';
            renderAll();

            try {
                const inputName = 'input_' + next.id + '_' + next.name; // 避免檔名衝突
                let outputExt = isCompressMode ? 'mp3' : 'wav';
                let outputName = 'output_' + next.id + '.' + outputExt;

                next.outputName = next.name.replace(/\.[^/.]+$/, "") + "." + outputExt;

                // 1. 寫入檔案
                statusLog.textContent = `Writing file ${next.name}...`;
                await ffmpeg.writeFile(inputName, await fetchFile(next.file));

                // 2. 執行轉檔指令
                statusLog.textContent = `Processing ${next.name}...`;

                let ffmpegArgs = [];
                if (isCompressMode) {
                    // MP3 模式
                    ffmpegArgs = ['-i', inputName, '-b:a', '128k', outputName];
                } else {
                    // WAV 模式
                    ffmpegArgs = ['-i', inputName, outputName];
                }

                await ffmpeg.exec(ffmpegArgs);

                // 3. 讀取結果
                statusLog.textContent = `Reading output...`;
                const data = await ffmpeg.readFile(outputName);

                // 4. 建立 Blob
                const blob = new Blob([data.buffer], { type: isCompressMode ? 'audio/mp3' : 'audio/wav' });
                next.url = URL.createObjectURL(blob);
                next.status = 'done';
                next.progress = 100;

                // 5. 清理記憶體
                await ffmpeg.deleteFile(inputName);
                await ffmpeg.deleteFile(outputName);

            } catch (err) {
                console.error(err);
                statusLog.textContent = `Error: ${err.message}`;
                next.status = 'error';
            }

            isProcessing = false;
            currentProcessingTaskId = null;
            renderAll();
            processNext();
        }

        // --- UI 渲染功能 ---

        function renderAll() {
            taskCountDisplay.textContent = tasks.length;

            if (tasks.length === 0) {
                emptyState.classList.remove('hidden');
                downloadAllBtn.classList.add('hidden');
                clearAllBtn.classList.add('hidden');
                taskList.innerHTML = '';
                return;
            }

            emptyState.classList.add('hidden');
            downloadAllBtn.classList.remove('hidden');
            clearAllBtn.classList.remove('hidden');
            downloadAllBtn.disabled = !tasks.some(t => t.status === 'done');

            taskList.innerHTML = '';
            tasks.forEach(task => {
                const item = document.createElement('div');
                item.id = `task-${task.id}`;
                item.className = `p-4 rounded-2xl border transition-all ${task.status === 'processing' ? 'bg-zinc-800/80 border-blue-500/50 scanning relative overflow-hidden' : 'bg-zinc-900 border-zinc-800'}`;

                const isDone = task.status === 'done';
                const isError = task.status === 'error';
                const isProc = task.status === 'processing';

                item.innerHTML = `
                    <div class="flex items-center justify-between mb-2 relative z-10">
                        <div class="flex items-center space-x-3 overflow-hidden">
                            <div class="w-8 h-8 rounded-lg bg-zinc-800 flex items-center justify-center shrink-0">
                                ${getStatusIcon(task.status)}
                            </div>
                            <div class="flex flex-col min-w-0">
                                <span class="text-xs font-bold text-zinc-200 truncate pr-2">${task.name}</span>
                                <span class="text-[10px] text-zinc-500 font-bold uppercase tracking-tighter">${task.size} • ${task.status.toUpperCase()}</span>
                            </div>
                        </div>
                        <div class="flex items-center space-x-1">
                            ${isDone ? `
                                <a href="${task.url}" download="${task.outputName}" class="p-2 text-green-500 hover:bg-green-500/10 rounded-lg transition-colors">
                                    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" /></svg>
                                </a>
                            ` : ''}
                            <button onclick="window.dispatchEvent(new CustomEvent('delete-task', {detail: '${task.id}'}))" class="p-2 text-zinc-600 hover:text-red-500 hover:bg-red-500/10 rounded-lg transition-colors">
                                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" /></svg>
                            </button>
                        </div>
                    </div>
                    ${(isProc || task.status === 'pending') ? `
                        <div class="w-full h-1 bg-zinc-800 rounded-full overflow-hidden relative z-10">
                            <div class="progress-bar h-full bg-blue-500 transition-all duration-300" style="width: ${task.progress}%"></div>
                        </div>
                    ` : ''}
                `;
                taskList.appendChild(item);
            });
        }

        function updateTaskProgressUI(id, progress) {
            const el = document.getElementById(`task-${id}`);
            if (el) {
                const bar = el.querySelector('.progress-bar');
                if (bar) bar.style.width = `${progress}%`;
            }
        }

        window.addEventListener('delete-task', (e) => {
            const id = e.detail;
            tasks = tasks.filter(t => t.id !== id);
            renderAll();
        });

        function getStatusIcon(status) {
            if (status === 'done') return '✅';
            if (status === 'error') return '❌';
            if (status === 'processing') return '⚙️';
            return '⏳';
        }

    </script>
</body>

</html>
